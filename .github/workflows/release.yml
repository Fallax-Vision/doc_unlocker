name: Build and Release
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: doc-unlocker-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python -c "import re; print(re.search(r'^__version__ = \"([0-9.]+)\"', open('doc_unlocker.py').read(), re.M).group(1))")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements.txt pytest pyinstaller
      - run: python -m pytest -q
      - name: Build executable
        if: needs.prepare.outputs.publish == 'true'
        run: python build_exe.py
      - uses: actions/upload-artifact@v4
        if: needs.prepare.outputs.publish == 'true'
        with:
          name: windows
          path: dist/*.exe
          retention-days: 7
          if-no-files-found: error
  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.1.0" "platform-tools"
      - name: Engine regression tests
        run: |
          python -m pip install msoffcrypto-tool==6.0.0 openpyxl==3.1.5
          python android/_jvmtest/make_fixture.py
          mkdir -p android/_jvmtest/out
          javac -d android/_jvmtest/out android/app/src/main/java/com/fallaxvision/docunlocker/engine/*.java android/_jvmtest/SecurityTests.java
          java -Xmx128m -cp android/_jvmtest/out SecurityTests android/_jvmtest/fixture.xlsx
      - name: Restore protected release signing key
        if: needs.prepare.outputs.publish == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/docunlocker-release.jks"
      - name: Validate Android
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew lintRelease testReleaseUnitTest --no-daemon
      - name: Build signed release APK
        if: needs.prepare.outputs.publish == 'true'
        working-directory: android
        env:
          DOC_UNLOCKER_KEYSTORE: ${{ runner.temp }}/docunlocker-release.jks
          DOC_UNLOCKER_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          DOC_UNLOCKER_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Verify and copy APK
        if: needs.prepare.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify "$APK"
          if "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging "$APK" | grep -q application-debuggable; then
            echo 'Refusing to publish a debuggable APK'; exit 1
          fi
          mkdir -p out
          cp "$APK" "out/DocUnlocker-v$VERSION.apk"
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/docunlocker-release.jks"
      - uses: actions/upload-artifact@v4
        if: needs.prepare.outputs.publish == 'true'
        with:
          name: android
          path: out/*.apk
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: [prepare, windows, android]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish both validated builds together
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          sha256sum out/* > out/SHA256SUMS.txt
          gh release create "v$VERSION" out/* --target "$GITHUB_SHA" --title "Doc Unlocker v$VERSION" --notes-file CHANGELOG.md
      - name: Enforce release and CI storage retention
        env:
          GH_TOKEN: ${{ github.token }}
        run: python github_retention.py --apply
