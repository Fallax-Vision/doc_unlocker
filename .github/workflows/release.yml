name: Build and Release

# Builds the Windows .exe and publishes it to a GitHub Release whenever a
# version tag (e.g. v1.0.0) is pushed.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: write          # needed to create the Release and upload assets

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller msoffcrypto-tool olefile

      - name: Install UPX (for a smaller .exe)
        run: choco install upx -y

      - name: Build the .exe
        run: python build_exe.py

      - name: Publish Release with the .exe
        uses: softprops/action-gh-release@v2
        with:
          name: Word Unlocker ${{ github.ref_name }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: dist/WordUnlocker.exe
